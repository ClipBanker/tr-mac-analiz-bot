name: aslan-team-bot

on:
  schedule:
    - cron: "35 * * * *"  # каждый час в :35 (UTC), со сдвигом относительно первого канала
  workflow_dispatch:       # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write          # чтобы сохранять state.json обратно в репозиторий

concurrency:
  group: betting-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fonts
        run: '[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)'

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_ASLAN }}
          BOT_STATE_FILE: state_aslan.json
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python bot.py --config config_aslan.yaml ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "betting-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_aslan.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F_%H:%M)"
          git pull --rebase --autostash -q || true
          git push
